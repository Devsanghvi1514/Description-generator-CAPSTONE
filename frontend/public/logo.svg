<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="vc-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="vc-grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="vc-grad-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <filter id="vc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Soft Ambient Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#vc-grad-glow)" />

  <!-- Outer Neural Shield Frame -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="white" fill-opacity="0.8" stroke="url(#vc-grad-primary)" stroke-width="2" filter="url(#vc-shadow)" />

  <!-- Aperture Neural Blades / Optical Lens Iris -->
  <g stroke="url(#vc-grad-primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Blade 1 (Top Left to Center) -->
    <path d="M 22 14 C 28 15, 36 21, 38 27" fill="none" />
    <!-- Blade 2 (Top Right to Center) -->
    <path d="M 44 20 C 43 27, 39 35, 33 39" fill="none" />
    <!-- Blade 3 (Bottom Right to Center) -->
    <path d="M 40 46 C 33 46, 25 41, 22 35" fill="none" />
    <!-- Blade 4 (Bottom Left to Center) -->
    <path d="M 17 40 C 18 33, 22 25, 29 21" fill="none" />
  </g>

  <!-- Outer Lens Rings -->
  <circle cx="32" cy="32" r="18" stroke="url(#vc-grad-primary)" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.75" />
  <circle cx="32" cy="32" r="13" stroke="url(#vc-grad-primary)" stroke-width="2" />

  <!-- Central Optical Core / Neural Pupil -->
  <circle cx="32" cy="32" r="6" fill="url(#vc-grad-core)" />
  <circle cx="30" cy="30" r="1.8" fill="white" opacity="0.9" />

  <!-- Neural Satellite Data Nodes -->
  <circle cx="20" cy="18" r="2" fill="#06b6d4" />
  <circle cx="45" cy="22" r="2" fill="#3b82f6" />
  <circle cx="43" cy="44" r="2" fill="#8b5cf6" />
  <circle cx="17" cy="38" r="2" fill="#06b6d4" />
</svg>
